[project]
name = "battery-dispatch"
version = "0.1.0"
description = "Battery dispatch optimisation across two wholesale electricity markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "fastexcel",
    "pulp",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
filterwarnings = [
    # polars' own from_arrow bridge inside pl.read_excel (fastexcel engine) — not
    # anything our code controls, harmless ahead of polars 2.0.
    "ignore:from_arrow.*will return a Series instead of a DataFrame:FutureWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_dispatch"]

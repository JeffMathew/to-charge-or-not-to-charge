[project]
name = "battery-dispatch"
version = "0.1.0"
description = "Battery dispatch optimisation across two wholesale electricity markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "fastexcel",
    "pulp",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_dispatch"]
